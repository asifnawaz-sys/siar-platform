<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#211c18">
  <title>{% block title %}Product Launch{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23211c18'/><polygon points='50,22 80,80 20,80' fill='%23f1731e'/></svg>">
</head>
<body{% block body_attrs %}{% endblock %}>
  {% block body %}{% endblock %}
  <div class="toasts"></div>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/form.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
