<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAR Digital Platform - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0b0d10 0%, #141820 100%);
      color: #eef2f7;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: #1a2029;
      border: 1px solid #2a313b;
      border-radius: 12px;
      padding: 48px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #d4a83d;
    }

    .subtitle {
      text-align: center;
      color: #9aa6b2;
      font-size: 13px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #eef2f7;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: #0e1116;
      border: 1px solid #2a313b;
      border-radius: 8px;
      color: #eef2f7;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #d4a83d;
      box-shadow: 0 0 0 3px rgba(212, 168, 61, 0.1);
    }

    .error-message {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: #d4a83d;
      color: #17130a;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #e5b94f;
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(212, 168, 61, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #9aa6b2;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: none;
      text-align: center;
      color: #9aa6b2;
      font-size: 13px;
      margin-top: 12px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #9aa6b2;
      border-top-color: #d4a83d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-box {
      background: #141820;
      border: 1px solid #2a313b;
      border-radius: 8px;
      padding: 16px;
      margin-top: 24px;
      font-size: 12px;
      color: #9aa6b2;
      line-height: 1.5;
    }

    .info-box code {
      background: #0e1116;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: #d4a83d;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
      }

      .logo h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1><span>SIAR</span> DIGITAL</h1>
      <p style="color: #9aa6b2; font-size: 12px; margin-top: 4px;">PLATFORM</p>
    </div>

    <div class="subtitle">Production operations platform</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <div class="error-message" id="errorMessage"></div>
      </div>

      <button type="submit" id="loginBtn">Sign In</button>
      <div class="loading" id="loading">
        <span class="spinner"></span>
        Authenticating...
      </div>
    </form>

    <div class="info-box">
      <strong>Demo Credentials:</strong><br>
      Username: <code>admin</code><br>
      Password: <code>admin@SIAR123</code>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Username and password are required');
        return;
      }

      await login(username, password);
    });

    async function login(username, password) {
      loginBtn.disabled = true;
      loading.classList.add('show');
      errorMessage.classList.remove('show');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Login failed. Please try again.');
          return;
        }

        // Store token in localStorage
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('username', data.username);

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = '/dashboard.html?token=' + data.token;
        }, 300);

      } catch (error) {
        showError('Connection error. Please try again.');
        console.error('Login error:', error);
      } finally {
        loginBtn.disabled = false;
        loading.classList.remove('show');
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      passwordInput.focus();
      passwordInput.select();
    }

    // Check if already authenticated
    window.addEventListener('load', async () => {
      const token = localStorage.getItem('auth_token');
      if (token) {
        const response = await fetch(`/api/auth/check?token=${token}`);
        const data = await response.json();
        if (data.authenticated) {
          window.location.href = '/dashboard.html?token=' + token;
        }
      }
    });
  </script>
</body>
</html>
